services:
  db:
    image: postgres:15.3
    container_name: cta-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apppass}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - appnet

  app:
    image: ${DOCKERHUB_USER}/compra-tu-auto-app-backend:${APP_VERSION_BACKEND}
    container_name: cta-app-back
    depends_on:
      db:
        condition: service_healthy         # espera a que Postgres esté listo
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-appdb}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-appuser}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-apppass}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_PROFILES_ACTIVE: prod
      # otras vars que necesite tu app...
    ports:
      - "8080:8080"                        # <-- ajustá si tu app usa otro puerto
    restart: unless-stopped
    networks:
      - appnet

  frontend:
    image: ${DOCKERHUB_USER}/compra-tu-auto-app-frontend:${APP_VERSION_FRONTEND}
    container_name: cta-app-frontend
    depends_on:
      app:
        condition: service_started         # espera a que el backend esté iniciado
    environment:
      PORT: ${FRONTEND_PORT:-4000}
      NODE_ENV: production
    ports:
      - "${FRONTEND_PORT:-4000}:${FRONTEND_PORT:-4000}"
    restart: unless-stopped
    networks:
      - appnet

  # Grafana, Prometheus, Loki y Promtail
  prometheus:
    image: prom/prometheus:latest
    container_name: cta-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - appnet
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    container_name: cta-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./loki-config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    networks:
      - appnet
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    container_name: cta-promtail
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - appnet
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:latest
    container_name: cta-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
      - loki
    networks:
      - appnet
    restart: unless-stopped

volumes:
  db-data:
  prometheus-data:
  loki-data:
  grafana-storage:

networks:
  appnet:

